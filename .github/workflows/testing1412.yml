name: repro-1412

on:
  workflow_dispatch:

jobs:
  empty-token-rate-limited:
    
    runs-on: [self-hosted]
    steps:
      - name: Rate limit before
        run: |
          curl -s https://api.github.com/rate_limit | jq '.resources.core'
      - name: Exhaust unauthenticated quota
        run: |
          for i in $(seq 1 70); do
            curl -s -o /dev/null -w "%{http_code} " \
              https://api.github.com/repos/actions/node-versions/contents/versions-manifest.json
          done
          echo
          curl -s https://api.github.com/rate_limit | jq '.resources.core'
    
      - name: Set up Node (empty token + LTS alias + mirror)
        uses: actions/setup-node@v7
        with:
          token: ''
          node-version: '26'
          mirror: 'https://example.invalid/nodejs'

      - name: Rate limit after
        if: always()
        run: |
          curl -s https://api.github.com/rate_limit | jq '.resources.core'
