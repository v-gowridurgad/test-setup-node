name: 'Repro 1412'

on:
  workflow_dispatch:

jobs:
  manifest-wins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.20.0'
          mirror: 'https://example.invalid/nodejs'
      - run: node --version

  lts-crash:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          token: 'ghp_invalidtokenforrepro000000000000000'
          mirror: 'https://example.invalid/nodejs'
      - run: node --version

  pinned-reaches-mirror:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses:  actions/setup-node@v7
        with:
          node-version: '22.20.0'
          token: 'ghp_invalidtokenforrepro000000000000000'
          mirror: 'https://example.invalid/nodejs'
      - run: node --version
