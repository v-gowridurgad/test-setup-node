name: 'Repro 1412'

on:
  workflow_dispatch:

jobs:
  manifest-wins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.0.1'
          mirror: 'https://mirrors.tuna.tsinghua.edu.cn/nodejs-release'
      - run: node --version

  lts-crash:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          token: 'ghp_invalidtokenforrepro000000000000000'
          mirror: 'https://mirrors.tuna.tsinghua.edu.cn/nodejs-release'
      - run: node --version

  pinned-reaches-mirror:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses:  actions/setup-node@v7
        with:
          node-version: '24.0.1'
          token: 'ghp_invalidtokenforrepro000000000000000'
          mirror: 'https://mirrors.tuna.tsinghua.edu.cn/nodejs-release'
      - run: node --version
