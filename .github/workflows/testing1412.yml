name: repro-1412-no-github-egress

on:
  workflow_dispatch:

jobs:
  lts-alias:
    runs-on: ubuntu-latest
    steps:
      - name: Block github.com and raw.githubusercontent.com
        run: |
          echo "127.0.0.1 api.github.com" | sudo tee -a /etc/hosts
          echo "127.0.0.1 raw.githubusercontent.com" | sudo tee -a /etc/hosts

      - uses: BridgeAR/setup-node@BridgeAR/2026-09-03-setup-node-manifest
        with:
          node-version: 'lts/*'
          mirror: 'https://example.invalid/nodejs'

  direct-version-control:
    runs-on: ubuntu-latest
    steps:
      - name: Block github.com and raw.githubusercontent.com
        run: |
          echo "127.0.0.1 api.github.com" | sudo tee -a /etc/hosts
          echo "127.0.0.1 raw.githubusercontent.com" | sudo tee -a /etc/hosts

      - uses: BridgeAR/setup-node@BridgeAR/2026-09-03-setup-node-manifest
        with:
          node-version: '26'
          mirror: 'https://example.invalid/nodejs'
