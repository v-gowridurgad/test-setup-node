name: testing-1412

on:
  workflow_dispatch:

jobs:
  # BUG: dies before the mirror is ever contacted
  lts-alias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          mirror: 'https://example.invalid/nodejs'
          token: 'ghp_invalidtokentoforcemanifestfailure00'

  # CONTROL: same failure, but survives and DOES reach the mirror
  pinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '22.20.0'
          mirror: 'https://example.invalid/nodejs'
          token: 'ghp_invalidtokentoforcemanifestfailure00'
